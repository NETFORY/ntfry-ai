[package]
name = "ntfry-ai"
version = "0.2.0"
edition = "2021"
description = "NETFORY AI Proxy - an OpenAI/LM Studio-compatible API gateway to a decentralized AI swarm (ai:// over iroh QUIC)"
license = "MIT"

[[bin]]
name = "ntfry-ai"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-stream = "0.1"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }

# --- P2P: same stack as ai-worker (ALPN netfory/ai/1) ---
iroh = "1"
iroh-relay = "1"

ureq = { version = "2", features = ["tls"] }
hex = "0.4"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
strip = true
